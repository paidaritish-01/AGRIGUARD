analysis_mode: close_up
supported_crops:
  - tomato
  - corn
  - wheat
  - apple
  - general_crop
primary_crop: tomato
seed: 42
device: auto
output_dir: checkpoints
model_version: 1.0.0

close_up:
  backbone: resnet18
  pretrained: true
  freeze_backbone: true
  fine_tune_epochs: 2
  dropout: 0.2
  learning_rate: 0.001
  fine_tune_lr: 0.0001
  weight_decay: 0.0001
  batch_size: 8
  epochs: 5
  early_stopping_patience: 3
  metric_for_best_checkpoint: val_macro_f1
  use_class_weights: true
  abstention_threshold: 0.70
  image_size: 224

data:
  dataset_dir: data/close_up
  metadata_file: data/close_up/metadata.csv
  split_group_column: farm_id
  train_ratio: 0.60
  val_ratio: 0.20
  test_ratio: 0.20
  num_workers: 0
  max_duplicate_check_samples: 5000
