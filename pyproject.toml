[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agriscan"
version = "1.0.0"
description = "Drone-Assisted Crop Health Monitoring ML Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.12",
    "pillow>=10.4.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "anyio>=4.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agriscan*"]
